<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phaser DevTools Panel</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-brand">
          <img class="topbar-logo" src="logo.png" alt="Phaser DevTools logo" />
          <div class="topbar-brand-text">
          <h1 class="title">Phaser DevTools</h1>
          <p id="status" class="status">Ready</p>
          </div>
        </div>
        <div class="toolbar-actions">
          <button id="pick-button" class="secondary-button topbar-button topbar-button-pick" type="button">
            Pick on page
          </button>
          <button
            id="game-info-toggle"
            class="section-toggle-button topbar-button topbar-button-info"
            type="button"
            aria-expanded="false"
            aria-controls="game-info-card"
          >
            Show game info
          </button>
          <button id="refresh-button" class="refresh-button topbar-button topbar-button-refresh" type="button">
            Refresh
          </button>
        </div>
      </header>

      <main class="layout">
        <section id="empty-state" class="empty-state">
          <h2>No Phaser game detected on this page</h2>
          <p>Open a page running Phaser 3 and click Refresh.</p>
        </section>

        <div id="content" class="content hidden">
          <section id="game-info-card" class="panel-card hidden">
            <div class="game-info-rows">
              <div class="game-info-row game-info-row-summary">
                <div class="game-info-item">
                  <span class="game-info-title">Game Info</span>
                </div>
                <div class="game-info-item game-info-item-detected">
                  <span class="game-info-label">Phaser</span>
                  <span
                    id="game-detected"
                    class="detection-light is-unknown"
                    role="status"
                    aria-label="Phaser detection unknown"
                  ></span>
                </div>
              </div>
              <div class="game-info-row game-info-row-pairs">
                <div class="game-info-item">
                  <span class="game-info-label">Width</span>
                  <span id="game-width" class="game-info-value">-</span>
                </div>
                <div class="game-info-item">
                  <span class="game-info-label">Renderer</span>
                  <span id="game-renderer" class="game-info-value">-</span>
                </div>
              </div>
              <div class="game-info-row game-info-row-pairs">
                <div class="game-info-item">
                  <span class="game-info-label">Height</span>
                  <span id="game-height" class="game-info-value">-</span>
                </div>
                <div class="game-info-item">
                  <span class="game-info-label">Scenes</span>
                  <span id="scene-count" class="game-info-value">-</span>
                </div>
              </div>
            </div>
          </section>

          <div class="panel-grid">
            <section class="panel-card">
              <div class="section-heading">
                <h2>Scenes</h2>
              </div>
              <div id="scene-list" class="list" role="list"></div>
            </section>

            <section class="panel-card inspector-card">
              <div class="section-heading">
                <div>
                  <h2>Scene Inspector</h2>
                  <p id="scene-inspector-title" class="section-meta">Select a scene</p>
                </div>
                <p id="scene-inspector-status" class="section-meta">No scene selected</p>
              </div>

              <div id="scene-inspector-header" class="scene-inspector-header">
                <div class="scene-inspector-title-wrap">
                  <h3 id="selected-scene-name" class="scene-inspector-name">No scene selected</h3>
                  <div id="selected-scene-pills" class="scene-inspector-pills"></div>
                </div>
                <div id="selected-scene-meta" class="scene-inspector-meta"></div>
              </div>

              <div id="inspector-tabs" class="inspector-tabs" role="tablist" aria-label="Scene inspector tabs">
                <button
                  id="tab-button-displayObjects"
                  class="inspector-tab-button is-active"
                  type="button"
                  role="tab"
                  aria-selected="true"
                  aria-controls="tab-panel-displayObjects"
                  data-inspector-tab="displayObjects"
                >
                  Display Objects
                </button>
                <button
                  id="tab-button-state"
                  class="inspector-tab-button"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="tab-panel-state"
                  data-inspector-tab="state"
                >
                  State
                </button>
                <button
                  id="tab-button-load"
                  class="inspector-tab-button"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="tab-panel-load"
                  data-inspector-tab="load"
                >
                  Load
                </button>
                <button
                  id="tab-button-camera"
                  class="inspector-tab-button"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="tab-panel-camera"
                  data-inspector-tab="camera"
                >
                  Camera
                </button>
                <button
                  id="tab-button-fps"
                  class="inspector-tab-button"
                  type="button"
                  role="tab"
                  aria-selected="false"
                  aria-controls="tab-panel-fps"
                  data-inspector-tab="fps"
                >
                  FPS
                </button>
              </div>

              <div class="inspector-panels">
                <section
                  id="tab-panel-displayObjects"
                  class="inspector-tab-panel"
                  role="tabpanel"
                  aria-labelledby="tab-button-displayObjects"
                  data-inspector-panel="displayObjects"
                >
                  <div class="tree-toolbar">
                    <div class="display-objects-heading">
                      <p id="object-list-title" class="section-meta">Select a scene</p>
                    </div>
                    <input
                      id="object-filter"
                      class="tree-filter-input"
                      type="search"
                      placeholder="Filter by name, type, or path"
                      autocomplete="off"
                      spellcheck="false"
                    />
                    <div id="breadcrumbs" class="breadcrumbs"></div>
                  </div>
                  <div id="object-list" class="list object-list" role="list" tabindex="0"></div>
                </section>

                <section
                  id="tab-panel-state"
                  class="inspector-tab-panel hidden"
                  role="tabpanel"
                  aria-labelledby="tab-button-state"
                  data-inspector-panel="state"
                >
                  <div id="state-panel-content"></div>
                </section>

                <section
                  id="tab-panel-load"
                  class="inspector-tab-panel hidden"
                  role="tabpanel"
                  aria-labelledby="tab-button-load"
                  data-inspector-panel="load"
                >
                  <div id="load-panel-content"></div>
                </section>

                <section
                  id="tab-panel-camera"
                  class="inspector-tab-panel hidden"
                  role="tabpanel"
                  aria-labelledby="tab-button-camera"
                  data-inspector-panel="camera"
                >
                  <div id="camera-panel-content"></div>
                </section>

                <section
                  id="tab-panel-fps"
                  class="inspector-tab-panel hidden"
                  role="tabpanel"
                  aria-labelledby="tab-button-fps"
                  data-inspector-panel="fps"
                >
                  <div id="fps-panel-content"></div>
                </section>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="panel-bridge.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
