<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phaser DevTools Panel</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1 class="title">Phaser DevTools</h1>
          <p id="status" class="status">Ready</p>
        </div>
        <div class="toolbar-actions">
          <button id="pick-button" class="secondary-button" type="button">Pick on page</button>
          <button
            id="game-info-toggle"
            class="section-toggle-button"
            type="button"
            aria-expanded="false"
            aria-controls="game-info-card"
          >
            Show game info
          </button>
          <button id="refresh-button" class="refresh-button" type="button">Refresh</button>
        </div>
      </header>

      <main class="layout">
        <section id="empty-state" class="empty-state">
          <h2>No Phaser game detected on this page</h2>
          <p>Open a page running Phaser 3 and click Refresh.</p>
        </section>

        <div id="content" class="content hidden">
          <section id="game-info-card" class="panel-card hidden">
            <div class="game-info-rows">
              <div class="game-info-row game-info-row-summary">
                <div class="game-info-item">
                  <span class="game-info-title">Game Info</span>
                </div>
                <div class="game-info-item game-info-item-detected">
                  <span class="game-info-label">Phaser</span>
                  <span
                    id="game-detected"
                    class="detection-light is-unknown"
                    role="status"
                    aria-label="Phaser detection unknown"
                  ></span>
                </div>
              </div>
              <div class="game-info-row game-info-row-pairs">
                <div class="game-info-item">
                  <span class="game-info-label">Width</span>
                  <span id="game-width" class="game-info-value">-</span>
                </div>
                <div class="game-info-item">
                  <span class="game-info-label">Renderer</span>
                  <span id="game-renderer" class="game-info-value">-</span>
                </div>
              </div>
              <div class="game-info-row game-info-row-pairs">
                <div class="game-info-item">
                  <span class="game-info-label">Height</span>
                  <span id="game-height" class="game-info-value">-</span>
                </div>
                <div class="game-info-item">
                  <span class="game-info-label">Scenes</span>
                  <span id="scene-count" class="game-info-value">-</span>
                </div>
              </div>
            </div>
          </section>

          <div class="panel-grid">
            <section class="panel-card">
              <div class="section-heading">
                <h2>Scenes</h2>
              </div>
              <div id="scene-list" class="list" role="list"></div>
            </section>

            <section class="panel-card">
              <div class="section-heading">
                <h2>Display Objects</h2>
                <p id="object-list-title" class="section-meta">Select a scene</p>
              </div>
              <div class="tree-toolbar">
                <input
                  id="object-filter"
                  class="tree-filter-input"
                  type="search"
                  placeholder="Filter by name, type, or path"
                  autocomplete="off"
                  spellcheck="false"
                />
                <div id="breadcrumbs" class="breadcrumbs"></div>
              </div>
              <div id="object-list" class="list object-list" role="list" tabindex="0"></div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="panel-bridge.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
